syntax = "proto3";

package ticketing.v1;

option go_package = "./api/proto/v1;ticketingv1";

message Order {
    string id = 1;
    string user_id = 2;
    string ticket_id = 3;
    int32 quantity = 4;
    double total_price = 5;
    string status = 6;
    string created_at = 7;
    string updated_at = 8;
}

message CreateOrderRequest {
    string user_id = 1;
    string ticket_id = 2;
    int32 quantity = 3;
    string idempotency_key = 4;
}

message CreateOrderResponse {
    Order order = 1;
}

service OrderService {
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}