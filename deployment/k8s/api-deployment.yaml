apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-api
  labels:
    app: ticketing-api
    tier: api
    app.kubernetes.io/name: ticketing-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketing-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ticketing-api
        tier: api
    spec:
      containers:
        - name: api-server
          image: ticketing-engine-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-rest
              containerPort: 8080
              protocol: TCP
            - name: grpc-port
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness Probe: Checks if the container process is alive
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness Probe: Checks if DB connection is active and container can receive traffic
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 2